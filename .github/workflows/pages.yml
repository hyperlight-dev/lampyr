name: GitHub Pages

on:
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - site/**
      - Justfile
      - README.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - site/**
      - Justfile
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # A private Pages site is served from the root of its own host rather
      # than under /lampyr/, so build for the URL Pages reports. Pull requests
      # build for the public URL, the site's default, and so do runs outside
      # main where Pages can't be read (a fork, say). On main, which deploys,
      # a failed read fails the build rather than publish a guessed base.
      - name: Read the Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Use the Pages URL
        if: steps.pages.outcome == 'success'
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "SITE_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "SITE_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"

      - name: Validate website
        run: just site-check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
