  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused preinstalled SDK space on the hosted runner
        # The handler contracts build each runtime's rootfs in Docker on top of
        # the restored cargo cache, which fills the root disk. Nothing here uses
        # the Android, Haskell or CodeQL bundles. The host .NET SDK stays: the
        # native contracts compile and run the dotnet adapter with it.
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          for unused in /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm --recursive --force -- "$unused"
            fi
          done
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install preview test dependency
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Vet
        run: just lint-go

      - name: Run unit tests
        run: just test-unit

      - name: Check executable CLI intent
        run: just test-cli

      - name: Check generated examples
        run: just examples-check

      - name: Check preview release tooling
        run: just test-preview-release

