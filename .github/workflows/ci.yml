          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-fiberd,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-fiberd,ignore-error=true,timeout=2m

      - name: Warm the fiber router build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: .
          file: ./activator/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-router,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-router,ignore-error=true,timeout=2m

      - name: Download the cluster suites' controller inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs

      - name: Install Kind and rootfs tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio jq
          just install-kind

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm

      - name: Install and use Lampyr on an independently created Kind cluster
        env:
          BUILDX_BUILDER: lampyr-ci-cache
          LAMPYR_CLUSTER_INPUTS: ${{ github.workspace }}/build/cluster-inputs
        run: just test-existing-kind-integration

  # Follows the README on a host set up like a developer's machine instead of
  # consuming artifacts from another job: no world-writable /dev/kvm, Docker's
  # containerd image store, and a docker-container buildx builder selected.
  # The exception is fiberd-k8s-controller's inputs, which have no release
  # yet: the job takes the ones CI builds as the checkout's defaults, as a
  # release's platform package would carry them.
  new-developer-workflow:
    needs: [cluster-inputs]
    runs-on: ubuntu-latest
    env:
      LAMPYR_WORKSPACE: ${{ github.workspace }}/build/workspace
    # Above the steps' own limits: a step that times out fails, and failed
    # steps get diagnostics; a job that times out is cancelled instead.
    timeout-minutes: 50
    defaults:
      run:
        # Set up by the "Join the kvm group" step; the steps before it use bash.
        shell: /usr/local/bin/kvm-group-shell {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused Android SDK space on the hosted runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          if [ -d /usr/local/lib/android ]; then
            sudo du -sh /usr/local/lib/android
            sudo rm --recursive --force -- /usr/local/lib/android
          fi
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0

      - name: Install the documented prerequisites
        timeout-minutes: 10
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio jq
          just install-kind

      # A developer reaches /dev/kvm through the kvm group, so join it rather
      # than open up the device. Group changes don't reach the runner's
      # running session, so later steps run through a shell that starts them
      # with sudo as the same user, which picks up the new group. sudo passes
      # SIGINT and SIGTERM on, so step timeouts still stop the script.
      - name: Join the kvm group
        timeout-minutes: 2
        shell: bash
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "this runner already opens /dev/kvm outside the kvm group, so the job wouldn't test it" >&2
            exit 1
          fi
          sudo usermod --append --groups kvm "$(id --user --name)"
          sudo tee /usr/local/bin/kvm-group-shell > /dev/null <<'EOF'
          #!/bin/sh
          # sudo resets the environment, so pass the step-specific GitHub and
          # runner paths explicitly.
          exec sudo --user="$(id --user --name)" /usr/bin/env \
            "PATH=$PATH" \
            "LAMPYR_WORKSPACE=$LAMPYR_WORKSPACE" \
            "GITHUB_ENV=$GITHUB_ENV" \
            "GITHUB_OUTPUT=$GITHUB_OUTPUT" \
            "GITHUB_PATH=$GITHUB_PATH" \
            "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            "RUNNER_TEMP=$RUNNER_TEMP" \
            "BUILDX_BUILDER=${BUILDX_BUILDER:-}" \
            bash --noprofile --norc -eo pipefail "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/kvm-group-shell
          echo '[ -r /dev/kvm ] && [ -w /dev/kvm ]' > "$RUNNER_TEMP/kvm-access.sh"
          kvm-group-shell "$RUNNER_TEMP/kvm-access.sh"
          stat --format '%U:%G %a' /dev/kvm | tee "$RUNNER_TEMP/kvm-before"

      - name: Use the containerd image store
        timeout-minutes: 5
        run: |
          config=/etc/docker/daemon.json
          sudo test -f "$config" || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '.features["containerd-snapshotter"] = true' "$config" \
            | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep io.containerd.snapshotter > /dev/null

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-ci-cache

      - name: Build the CLI and container inputs
        timeout-minutes: 10
        run: |
          just build-ly setup-hluk build-fiberd build-control-plane
          build/ly doctor
          echo "$PWD/build" >> "$GITHUB_PATH"

      - name: Download the cluster suites' controller inputs
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs

      # The Kind provider shares the registry this starts on its default
      # port, 5002, from which the nodes pull the built images.
      # kvm-group-shell passes on only the variables it names.
      - name: Use the cluster suites' controller inputs
        timeout-minutes: 5
        shell: bash
        env:
          LAMPYR_CLUSTER_INPUTS: ${{ github.workspace }}/build/cluster-inputs
        run: just use-cluster-inputs 5002

      - name: Warm the Kind provider rootfs build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: ./providers/kind
          file: ./providers/kind/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
            platform=./k8s
            common=./providers/common
          provenance: false
          cache-from: type=gha,scope=ci-provider-kind-rootfs,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-provider-kind-rootfs,ignore-error=true,timeout=2m

      - name: Warm the Fiberd build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: .
          file: ./fiberd/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-fiberd,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-fiberd,ignore-error=true,timeout=2m

      - name: Warm the fiber router build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: .
          file: ./activator/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-router,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-router,ignore-error=true,timeout=2m

      - name: Install a local Kind cluster
        timeout-minutes: 25
        env:
          BUILDX_BUILDER: lampyr-ci-cache
        run: |
          # kind::build takes an optional snapshot mode, so run each recipe on its own.
          just kind::build
          just cli::runtime-images
          docker buildx prune --builder lampyr-ci-cache --all --force
          df -h /
          just cluster-install

      # In the README's order: ly dev keeps running while the app is built and
      # deployed, and is stopped afterwards to free port 8080.
      - name: Run, build and deploy the demo apps
        timeout-minutes: 25
        run: |
          repo="$PWD"
          cd "$LAMPYR_WORKSPACE"
          answers() {
            curl --fail --silent --show-error --max-time 10 \
              -H "Host: $app.default.localhost" http://127.0.0.1:8080/test \
              | tee /dev/stderr | grep "hello from $app" > /dev/null
          }
          for app in demo-app second-app; do
            "$repo/build/ly" scaffold service "$app"
            service="services/$app"
            source "$repo/scripts/runtime-examples.sh"
            expose_workspace_services "$PWD"
            # Each app says its own name, so a response shows which one answered.
            sed --in-place "s/hello from Hyperlight edge/hello from $app/" "$service/handler.js"
            grep --quiet "hello from $app" "$service/handler.js"
            "$repo/build/ly" dev --port 8080 "$service" > "$RUNNER_TEMP/$app-dev.log" 2>&1 &
            dev=$!
            ok=
            for _ in $(seq 120); do
              if answers 2> /dev/null; then ok=1; break; fi
              kill -0 "$dev" 2> /dev/null || break
              sleep 5
            done
            if [ -z "$ok" ]; then cat "$RUNNER_TEMP/$app-dev.log"; exit 1; fi

            "$repo/build/ly" build "$service"
            "$repo/build/ly" deploy --image "localhost:5002/$app:v1" "$service"
            # ly build rewrote the rootfs that ly dev is running from.
            kill -0 "$dev" || { cat "$RUNNER_TEMP/$app-dev.log"; exit 1; }
            answers || { cat "$RUNNER_TEMP/$app-dev.log"; exit 1; }

            kill "$dev" 2> /dev/null || true
            wait "$dev" 2> /dev/null || true
            for _ in $(seq 30); do
              status=0
              curl --silent --max-time 5 --output /dev/null http://127.0.0.1:8080/ || status=$?
              # 7: connection refused; a timeout would mean something still holds the port.
              [ "$status" -eq 7 ] && continue 2
              sleep 1
            done
            echo "port 8080 still answers after stopping ly dev for $app" >&2
            exit 1
          done

      - name: Call the deployed apps through Kourier
        timeout-minutes: 10
        run: |
          kubectl port-forward -n kourier-system svc/kourier 8080:80 &
          forward=$!
          trap 'kill "$forward" 2> /dev/null || true' EXIT
          for app in demo-app second-app; do
            curl --fail --silent --show-error --max-time 30 --retry 8 --retry-delay 2 --retry-all-errors \
              -H "Host: $app.default.localhost" http://127.0.0.1:8080/test \
              | tee /dev/stderr | grep "hello from $app" > /dev/null
          done
          # Free the smoke-test homes before the walkthrough deploys its own app.
          build/ly delete "$LAMPYR_WORKSPACE/services/demo-app"
          build/ly delete "$LAMPYR_WORKSPACE/services/second-app"
          # The walkthrough owns a separate disposable installation and registry.
          build/ly cluster uninstall --provider kind --delete-cluster --workspace "$LAMPYR_WORKSPACE"

      - name: Check that /dev/kvm is unchanged
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          # Without a snapshot the KVM step already failed and said why.
          [ -f "$RUNNER_TEMP/kvm-before" ] || exit 0
          stat --format '%U:%G %a' /dev/kvm | tee "$RUNNER_TEMP/kvm-after"
          diff "$RUNNER_TEMP/kvm-before" "$RUNNER_TEMP/kvm-after"

      - name: Collect diagnostics
        if: failure()
        timeout-minutes: 10
        shell: bash
        run: |
          kubectl get pods --all-namespaces --output wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 100 || true
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp "$RUNNER_TEMP"/*-dev.log "$RUNNER_TEMP/diagnostics/" 2> /dev/null || true
          kind export logs --name lampyr "$RUNNER_TEMP/diagnostics/kind" || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-developer-workflow-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  walkthrough:
    needs: [cluster-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free unused Android SDK space on the hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm --recursive --force -- /usr/local/lib/android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-walkthrough-cache
      - name: Build the CLI and container inputs
        run: just build-ly setup-hluk build-fiberd build-control-plane
      - name: Download the cluster suites' controller inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs
      # The walkthrough installs with registryPort 5500, so the Kind
      # provider shares the registry this starts there.
      - name: Use the cluster suites' controller inputs
        env:
          LAMPYR_CLUSTER_INPUTS: ${{ github.workspace }}/build/cluster-inputs
        run: just use-cluster-inputs 5500
      - name: Warm the Kind provider rootfs build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-walkthrough-cache
          context: ./providers/kind
          file: ./providers/kind/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
            platform=./k8s
            common=./providers/common
          provenance: false
          cache-from: type=gha,scope=ci-provider-kind-rootfs,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-provider-kind-rootfs,ignore-error=true,timeout=2m
      - name: Warm the Fiberd build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-walkthrough-cache
          context: .
          file: ./fiberd/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-fiberd,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-fiberd,ignore-error=true,timeout=2m
      - name: Warm the fiber router build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-walkthrough-cache
          context: .
          file: ./activator/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-router,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-router,ignore-error=true,timeout=2m
      - name: Install Kind and rootfs tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio jq
          just install-kind
          sudo chmod 0666 /dev/kvm
      - name: Test the walkthrough
        env:
          BUILDX_BUILDER: lampyr-walkthrough-cache
        run: just test-walkthrough

  ci-passed:
    if: always()
    needs: [typos, runtime-assets, rust-cli, macos-cli, hluk-helper, cluster-inputs, provider-arm64-guests, macos-provider-snapshots, azure-provider, unit, local-runtime, local-contracts, kind-runtime-integration, kind-cluster-lifecycle, kind-existing-cluster, knative-portability, new-developer-workflow, walkthrough, kind-provider, kind-provider-integration, k3d-integration, k3d-provider-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          jq --exit-status 'all(.result == "success")' \
            <<< '${{ toJson(needs) }}'
