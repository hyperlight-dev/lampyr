      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-ci-cache

      - name: Build runtime assets
        run: just build

      - name: Warm the Kind provider rootfs build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: ./providers/kind
          file: ./providers/kind/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
            platform=./k8s
            common=./providers/common
          provenance: false
          cache-from: type=gha,scope=ci-provider-kind-rootfs,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-provider-kind-rootfs,ignore-error=true,timeout=2m

      - name: Warm the Fiberd build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: .
          file: ./fiberd/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-fiberd,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-fiberd,ignore-error=true,timeout=2m

      - name: Warm the fiber router build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: .
          file: ./activator/ci.Dockerfile
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-router,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-router,ignore-error=true,timeout=2m

      - name: Download the cluster suites' controller inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs

      - name: Install Kind and rootfs tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio jq
          just install-kind

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm

      - name: Run Kind runtime examples
        env:
          BUILDX_BUILDER: lampyr-ci-cache
          LAMPYR_CI_SUITE: ${{ matrix.suite }}
          LAMPYR_CI_EXAMPLES: ${{ matrix.examples }}
          LAMPYR_CI_EVENTING: ${{ matrix.eventing }}
          LAMPYR_CI_EVENTING_ONLY: ${{ matrix.eventing_only || '0' }}
          LAMPYR_CI_RUNTIME_EXTRAS: ${{ matrix.extras }}
          LAMPYR_CI_RELEASE_GATES: ${{ matrix.release_gates }}
