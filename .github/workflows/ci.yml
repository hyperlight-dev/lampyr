          - name: node-eventing
            suite: runtime
            examples: hello-nodejs
            eventing: "1"
            eventing_only: "1"
            extras: "0"
            release_gates: "0"
          - name: python
            suite: runtime
            examples: hello-python hello-python-standalone
            eventing: "0"
            extras: "0"
            release_gates: "0"
          - name: go
            suite: runtime
            examples: hello-go hello-go-standalone
            eventing: "0"
            extras: "0"
            release_gates: "0"
          - name: rust
            suite: runtime
            examples: hello-rust hello-rust-standalone
            eventing: "0"
            extras: "0"
            release_gates: "0"
          - name: dotnet
            suite: runtime
            examples: hello-dotnet hello-dotnet-standalone
            eventing: "0"
            extras: "0"
            release_gates: "0"
          - name: release-gates
            suite: runtime
            examples: hello-nodejs
            eventing: "0"
            extras: "0"
            release_gates: "1"
          - name: fresh-mode
            suite: modes
            examples: ""
            eventing: "0"
            extras: "1"
            release_gates: "0"
            mode_checks: fresh
          - name: reuse-mode
            suite: modes
            examples: ""
            eventing: "0"
            extras: "1"
            release_gates: "0"
            mode_checks: reuse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused preinstalled SDK space on the hosted runner
        # Building every runtime example and running Kind fills the runner's
        # root disk without this headroom. .NET builds run inside Docker, so
        # the host SDKs are unused here.
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          for unused in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
