name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A pull request's runs share a group, so a newer push replaces the older
  # run; every other run (each commit on main) gets a group of its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  no-skipped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Reject disabled tests
        run: just check-no-skipped-tests

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      - name: Check license headers
        run: hack/check-license-headers.sh

  runtime-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          # Exact hits are immutable; misses start cold instead of carrying stale
          # artifacts into the next generation. v2 excludes inflated old caches.
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Validate runtime asset builds
        run: just build

  rust-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check and test the Rust CLI
        run: just cli::test

      # Hosted runners' primary group is shared, so give the runner user a
      # private group first, as Ubuntu and Debian create for every user.
      - name: Test permission checks under umask 002
        run: |
          sudo groupadd --force "$USER"
          sudo usermod --gid "$USER" "$USER"
          sudo --preserve-env --user "$USER" --group "$USER" env "PATH=$PATH" just cli::test-group-umask

      - name: Check the unchanged CLI intent against Rust
        run: just cli::test-intent

  macos-cli:
    runs-on: [self-hosted, macos, arm64, hvf]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038 # v2.3.1
        with:
          additional-toolchain-directory: cli
          just-version: "1.43"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and test the macOS CLI
        run: just cli::test-macos

      - name: Build the macOS CLI
        run: just cli::build-macos

  hluk-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            helper/target
            build/hluk
            build/kernel
          key: helper-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml', 'helper/Cargo.lock', 'helper/Cargo.toml', 'helper/rust-toolchain.toml') }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check and test the helper
        run: just helper::test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm

      - name: Build templates to drive the helper with
        run: |
          just cli::build cli::setup-hluk
          cli/target/debug/ly build docs/examples/hello-rust --output build/helper-template
          just helper::incarnation-template cli/target/debug/ly build/helper-incarnation-template

      - name: Drive the helper over fiberd's protocol
        env:
          LAMPYR_HELPER_INCARNATION_TEMPLATE: build/helper-incarnation-template
        run: just helper::test-kvm build/helper-template

      - name: Prepare the helper image context
        run: just helper::prepare-image

  # Builds what the cluster suites install in place of the published
  # controller inputs: the stock fiberd, helper and fiberd-k8s-controller
  # images and the controller's manifest, from upstream/pins.env's commits
  # and this checkout's helper, once for every suite.
  cluster-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo builds only the helper here, so this job caches apart from
      # hluk-helper, which also builds the CLI and runtime assets.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            helper/target
          key: cluster-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helper/Cargo.lock', 'helper/Cargo.toml', 'helper/rust-toolchain.toml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-ci-cache

      - name: Check out the pinned fiberd
        run: just upstream::prepare-fiberd-image

      # The cluster inputs build fiberd as go.mod's version, which fiberd
      # -version prints, so the cache is warmed with it too.
      - name: Read the fiberd version
        id: fiberd-version
        # A failure inside $(...) as an argument would not stop the step.
        run: |
          version=$(just upstream::fiberd-version)
          [[ -n $version ]] || { echo "just upstream::fiberd-version printed nothing" >&2; exit 1; }
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      # fiberd's image builds criu and its zygote library, so keep every
      # stage; the pin changes rarely.
      - name: Warm the stock fiberd build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-ci-cache
          context: build/upstream/fiberd
          file: build/upstream/fiberd/docker/fiberd/Dockerfile
          target: fiberd
          build-args: VERSION=${{ steps.fiberd-version.outputs.version }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-upstream-fiberd,timeout=2m
          cache-to: type=gha,mode=max,scope=ci-upstream-fiberd,ignore-error=true,timeout=2m

      - name: Build the cluster suites' controller inputs
        env:
          BUILDX_BUILDER: lampyr-ci-cache
        run: just upstream::cluster-inputs build/cluster-inputs

      - name: Upload the cluster suites' controller inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  provider-arm64-guests:
    name: provider-arm64-guests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, k3d, azure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install provider packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Build macOS ARM64 provider rootfs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./providers/${{ matrix.provider }}
          file: ./providers/${{ matrix.provider }}/Dockerfile
          target: rootfs
          platforms: linux/arm64
          build-contexts: |
            platform=./k8s
            common=./providers/common
            kind=./providers/kind
          load: true
          tags: lampyr-provider-${{ matrix.provider }}-rootfs-arm64:0.1.0
          provenance: false
          cache-from: type=gha,scope=ci-provider-${{ matrix.provider }}-linux-arm64,timeout=2m
          cache-to: type=gha,mode=max,scope=ci-provider-${{ matrix.provider }}-linux-arm64,ignore-error=true,timeout=2m

      - name: Package macOS ARM64 provider guest
        env:
          LAMPYR_PROVIDER_PREBUILT_IMAGE: lampyr-provider-${{ matrix.provider }}-rootfs-arm64:0.1.0
        run: |
          just providers::build-platform-artifact \
            "${{ matrix.provider }}" \
            "$RUNNER_TEMP/provider-${{ matrix.provider }}" \
            linux/arm64 macos aarch64

      - name: Upload macOS ARM64 provider guests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-guests-darwin-arm64-${{ matrix.provider }}-${{ github.sha }}
          path: ${{ runner.temp }}/provider-${{ matrix.provider }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos-provider-snapshots:
    needs:
      - provider-arm64-guests
    runs-on: [self-hosted, macos, arm64, hvf]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038 # v2.3.1
        with:
          additional-toolchain-directory: cli
          just-version: "1.43"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS ARM64 provider guests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provider-guests-darwin-arm64-*-${{ github.sha }}
          path: ${{ runner.temp }}/providers-darwin-arm64
          merge-multiple: true

      - name: Capture and restore macOS provider snapshots
        run: |
          just providers::capture-platform-variants \
            "$RUNNER_TEMP/providers-darwin-arm64" \
            "$RUNNER_TEMP/provider-variants-hvf" \
            macos aarch64

  azure-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the Azure provider without cloud credentials
        run: just azure::test-unit

      - name: Build the Azure node setup image
        run: just azure::node-setup-image

  azure-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install rootfs tools and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio
          sudo chmod 0666 /dev/kvm
      - name: Test the Azure guest without cloud credentials
        run: just azure::test

  kind-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Check the Kind provider without a cluster
        run: just kind::test-unit
      - name: Check the k3d provider without a cluster
        run: just k3d::test-unit

  kind-provider-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-kind-provider-cache
      - name: Warm the Kind provider rootfs build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-kind-provider-cache
          context: ./providers/kind
          file: ./providers/kind/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
            platform=./k8s
            common=./providers/common
          provenance: false
          cache-from: type=gha,scope=ci-provider-kind-rootfs,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-provider-kind-rootfs,ignore-error=true,timeout=2m
      - name: Install rootfs tools and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio
          sudo chmod 0666 /dev/kvm
      - name: Exercise Kind guest ownership and lifecycle
        env:
          BUILDX_BUILDER: lampyr-kind-provider-cache
        run: just kind::test
      - name: Test CLI runtime and provider boundaries
        run: |
          LAMPYR_TEST_ROOTFS="$PWD/providers/kind/build/rootfs/rootfs.cpio" \
            just cli::test-runtime

  k3d-integration:
    name: k3d-integration (${{ matrix.name }})
    needs: [cluster-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodejs
            examples: hello-nodejs
            lifecycle_only: "0"
            runtime_only: "1"
          - name: python
            examples: hello-python
            lifecycle_only: "0"
            runtime_only: "1"
          - name: go
            examples: hello-go
            lifecycle_only: "0"
            runtime_only: "1"
          - name: rust
            examples: hello-rust
            lifecycle_only: "0"
            runtime_only: "1"
          - name: dotnet
            examples: hello-dotnet
            lifecycle_only: "0"
            runtime_only: "1"
          - name: lifecycle
            examples: ""
            lifecycle_only: "1"
            runtime_only: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free unused preinstalled SDK space on the hosted runner
        # A single compiled example can consume about 8 GB before cleanup.
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          for unused in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm --recursive --force -- "$unused"
            fi
          done
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            build/hluk
            build/kernel
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-k3d-cache
      - name: Warm the k3d provider build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-k3d-cache
          context: ./providers/k3d
          file: ./providers/k3d/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
            common=./providers/common
            kind=./providers/kind
          provenance: false
          cache-from: type=gha,scope=ci-provider-k3d-rootfs,timeout=2m
          cache-to: type=gha,mode=min,scope=ci-provider-k3d-rootfs,ignore-error=true,timeout=2m
      - name: Download the cluster suites' controller inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs-${{ github.sha }}
          path: build/cluster-inputs
      - name: Install test tools and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cpio jq
          sudo chmod 0666 /dev/kvm
      - name: Deploy and test every runtime example on k3d
        env:
          BUILDX_BUILDER: lampyr-k3d-cache
          LAMPYR_CI_EXAMPLES: ${{ matrix.examples }}
          LAMPYR_CI_RUNTIME_ONLY: ${{ matrix.runtime_only }}
          LAMPYR_CI_LIFECYCLE_ONLY: ${{ matrix.lifecycle_only }}
          LAMPYR_CLUSTER_INPUTS: ${{ github.workspace }}/build/cluster-inputs
        run: just test-k3d-integration

  k3d-provider-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
            providers/runtime/build/elfloader_hyperlight-x86_64
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml', 'cli/rust-toolchain.toml') }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: lampyr-k3d-provider-cache
      - name: Warm the k3d provider build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: lampyr-k3d-provider-cache
          context: ./providers/k3d
          file: ./providers/k3d/Dockerfile
          target: rootfs
          platforms: linux/amd64
          build-contexts: |
