apiVersion: v1
kind: Namespace
metadata:
  name: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lampyr-observability-prometheus
  labels:
    app.kubernetes.io/part-of: lampyr-observability
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lampyr-observability-prometheus
  labels:
    app.kubernetes.io/part-of: lampyr-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lampyr-observability-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lampyr-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lampyr-observability-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: lampyr-observability
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lampyr-observability-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: lampyr-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lampyr-observability-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: lampyr-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: fiber-router
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: lampyr-system
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fiber-router
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.lampyr-observability.svc.cluster.local:8080]
      - job_name: kubernetes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor
      - job_name: jaeger
        static_configs:
          - targets: [jaeger.lampyr-observability.svc.cluster.local:8888]
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
data:
  jaeger.yaml: |
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memory
      jaeger_storage:
        backends:
          memory:
            memory:
              max_traces: 10000
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memory
    service:
      extensions: [healthcheckv2, jaeger_query, jaeger_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: lampyr-observability
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: lampyr-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
        app.kubernetes.io/part-of: lampyr-observability
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --resources=deployments,namespaces,nodes,pods
            - --metric-labels-allowlist=pods=[lampyr.dev/home]
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lampyr-observability
  labels:
    app: prometheus
    app.kubernetes.io/part-of: lampyr-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: lampyr-observability
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: lampyr-observability
  labels:
    app: jaeger
    app.kubernetes.io/part-of: lampyr-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/part-of: lampyr-observability
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
          args:
            - --config=/etc/jaeger/jaeger.yaml
          ports:
            - name: query
              containerPort: 16686
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /status
              port: health
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  selector:
    app: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
  namespace: lampyr-observability
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lampyr-system
          podSelector:
            matchLabels:
              app: fiber-router
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lampyr-observability-scrape
  namespace: lampyr-system
  labels:
    app.kubernetes.io/part-of: lampyr-observability
spec:
  podSelector:
    matchLabels:
      app: fiber-router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lampyr-observability
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
