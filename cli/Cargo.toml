[package]
name = "lampyr-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
publish = false

[[bin]]
name = "ly"
path = "src/main.rs"

[[bin]]
name = "runtime-assets"
path = "src/runtime_assets.rs"

[[bin]]
name = "provider-snapshot"
path = "src/provider_snapshot.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
go-parse-duration = "0.1.1"
hyperlight-unikraft = { version = "=0.21.0", default-features = false, features = ["cpio"] }
hyperlight-host = { version = "=0.19.0", default-features = false }
indicatif = "0.18"
libc = "0.2"
# The upstream transport hook preserves HTTP status and enforces HTTPS for token requests.
oci-client = { git = "https://github.com/oras-project/rust-oci-client", rev = "a913569b1918ea1fda72ed3ba3711b93dea9100f", default-features = false, features = ["rustls-tls-no-provider"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
which = "8"
zip = { version = "6", default-features = false, features = ["deflate"] }
getrandom = "0.3"
git2 = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1"

[dev-dependencies]
indicatif = { version = "0.18", features = ["in_memory"] }
