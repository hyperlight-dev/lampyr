# Grafana dashboard for the tour, loaded by the Grafana sidecar.
{
 "apiVersion": "v1",
 "kind": "ConfigMap",
 "metadata": {
  "name": "lampyr-dashboard",
  "namespace": "monitoring",
  "labels": {
   "grafana_dashboard": "1"
  }
 },
 "data": {
  "lampyr.json": "{\n \"title\": \"Lampyr\",\n \"uid\": \"lampyr\",\n \"schemaVersion\": 39,\n \"refresh\": \"5s\",\n \"time\": {\n  \"from\": \"now-15m\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"timeseries\",\n   \"title\": \"Busy Fibers (micro-VMs) serving a request, runner\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum(lampyr_router_fibers_busy{exported_namespace=\\\"default\\\",revision=~\\\"runner-[0-9a-f]{12}\\\"})\",\n     \"legendFormat\": \"runner\"\n    }\n   ]\n  },\n  {\n   \"id\": 2,\n   \"type\": \"timeseries\",\n   \"title\": \"Pods on the node (the kubelet's default maxPods is 110)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum(kube_pod_status_phase{phase=\\\"Running\\\"})\",\n     \"legendFormat\": \"running pods\"\n    },\n    {\n     \"refId\": \"B\",\n     \"expr\": \"sum(kube_pod_status_phase{phase=\\\"Pending\\\"})\",\n     \"legendFormat\": \"pending pods\"\n    }\n   ]\n  },\n  {\n   \"id\": 3,\n   \"type\": \"timeseries\",\n   \"title\": \"Time to get a Fiber (histogram tops out at 30 s)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(lampyr_router_fiber_acquire_seconds_bucket{kind!~\\\"error|canceled\\\"}[30s])))\",\n     \"legendFormat\": \"p50\"\n    },\n    {\n     \"refId\": \"B\",\n     \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(lampyr_router_fiber_acquire_seconds_bucket{kind!~\\\"error|canceled\\\"}[30s])))\",\n     \"legendFormat\": \"p99\"\n    }\n   ]\n  },\n  {\n   \"id\": 4,\n   \"type\": \"timeseries\",\n   \"title\": \"Memory (RSS): container replicas vs the runner's home pod\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"bytes\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum(container_memory_rss{namespace=\\\"baseline\\\",container=\\\"runner\\\"})\",\n     \"legendFormat\": \"container replicas\"\n    },\n    {\n     \"refId\": \"B\",\n     \"expr\": \"sum(container_memory_rss{container!=\\\"\\\",container!=\\\"POD\\\"} * on(namespace, pod) group_left() max by (namespace, pod) (kube_pod_labels{label_lampyr_dev_home=\\\"true\\\",label_serving_knative_dev_service=\\\"runner\\\"}))\",\n     \"legendFormat\": \"runner's home pod\"\n    }\n   ]\n  },\n  {\n   \"id\": 5,\n   \"type\": \"timeseries\",\n   \"title\": \"Requests completed per second (a request counts when it ends)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (code) (rate(lampyr_router_request_duration_seconds_count[30s]))\",\n     \"legendFormat\": \"{{code}}\"\n    },\n    {\n     \"refId\": \"B\",\n     \"expr\": \"sum(rate(lampyr_router_shed_total[30s])) or vector(0)\",\n     \"legendFormat\": \"shed (fibers.max, memory/pids pressure, or rate limit or restores past the acquire timeout)\"\n    }\n   ]\n  },\n  {\n   \"id\": 6,\n   \"type\": \"timeseries\",\n   \"title\": \"Request latency (histogram tops out at 30 s)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(lampyr_router_request_duration_seconds_bucket[30s])))\",\n     \"legendFormat\": \"p50\"\n    },\n    {\n     \"refId\": \"B\",\n     \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(lampyr_router_request_duration_seconds_bucket[30s])))\",\n     \"legendFormat\": \"p99\"\n    }\n   ]\n  }\n ],\n \"templating\": {\n  \"list\": []\n },\n \"annotations\": {\n  \"list\": []\n }\n}"
 }
}
