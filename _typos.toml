[default.extend-words]
# Azure Kubernetes Service, in prose (AKS) and in names and paths.
aks = "aks"
# Disabled JavaScript test-suite API rejected by ESLint.
xdescribe = "xdescribe"

[files]
extend-exclude = ["deps/"]

[type.patch]
extend-glob = ["*.patch"]
extend-ignore-re = ["(?m)^index [0-9a-f]+\\.\\.[0-9a-f]+ [0-7]+$"]

[type.patch.extend-words]
vas = "vas"
